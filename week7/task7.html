<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Flexbox</title>

    <style>
        /* Task 7.1: Navbar using Flexbox */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 15px 40px;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }
        /* Task 7.2: Banner using Flexbox */

.banner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    height: 400px;
    background-color: #dbeafe;
    text-align: center;
}

.banner h1 {
    font-size: 40px;
    color: #1e293b;
}

.banner p {
    font-size: 18px;
}

.banner button {
    padding: 12px 25px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 5px;
}
    </style>
</head>

<body>

    <!-- Task 7.1: Navbar -->

    <nav class="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>

            <button>Get Started</button>
        </div>
        
    </nav>
    <!-- Task 7.2: Banner -->

<section class="banner">

    <h1>Welcome to My Website</h1>

    <p>Learn Web Development with Flexbox</p>

    <button>Explore More</button>

</section>
</body>
</html>
