
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6 - Box Model</title>

    <style>
        /* Task 6.1: Box sizing */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        .box-demo {
            width: 320px;
            padding: 25px;
            border: 5px solid #2563eb;
            margin: 30px auto;
            background-color: #dbeafe;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }
    </style>
</head>

<body>
    <h1>CSS Box Model</h1>

    <div class="box-demo">
        <h2>My Profile Card</h2>
        <p>This is the content area.</p>
        <p>Padding creates space inside the border.</p>
        <p>The border surrounds the content and padding.</p>
        <p>Margin creates space outside the border.</p>
    </div>
</body>
</html>
